<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estoque MB</title>
<meta name="apple-mobile-web-app-title" content="Estoque MB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07080a">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  html,body{margin:0;height:100%;background:#07080a;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#07080a}
  #ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#cfd4da;font:600 14px -apple-system,Segoe UI,Arial,sans-serif;transition:opacity .3s}
  #ld img{width:84px;height:84px;border-radius:20px}
  #ld.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="ld"><img src="apple-touch-icon.png" alt=""><span>Carregando o estoque…</span></div>
<iframe id="app" title="Portal do Vendedor" allow="clipboard-read; clipboard-write; web-share; fullscreen"
  src="https://script.google.com/macros/s/AKfycbxBzzrjY3ur7RDzm6goDDU8HZxKbexzJwA_xqTU9Gf2bV-dq_3lOD_TbjZ4qhNu7rvCbg/exec"></iframe>
<script>
  /* guarda o login e o ultimo estoque visto nesta pagina (no iPhone o app perde tudo ao fechar a aba) */
  function daqui(w) {   /* so aceita mensagens de quadros que estao DENTRO desta pagina */
    try { for (var i = 0; i < 6 && w; i++) { if (w === window) return i > 0; if (w === w.parent) return false; w = w.parent; } } catch (x) {}
    return false;
  }
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    if (!daqui(e.source)) return;
    var d = e.data || {};
    try {
      if (d.mbCache === 'set' && typeof d.dados === 'string' && d.dados.length < 2000000) { localStorage.setItem('mb_dados', d.dados); return; }
      if (!d.mbAuth) return;
      if (d.mbAuth === 'set' && d.token) localStorage.setItem('mb_auth', JSON.stringify({ token: d.token, name: d.name || '', email: d.email || '' }));
      else if (d.mbAuth === 'clear') { localStorage.removeItem('mb_auth'); localStorage.removeItem('mb_dados'); }
      else if (d.mbAuth === 'get') {
        var v = {}; try { v = JSON.parse(localStorage.getItem('mb_auth') || '{}') || {}; } catch (x) {}
        e.source.postMessage({ mbAuth: 'val', token: v.token || null, name: v.name || '', email: v.email || '', cache: v.token ? (localStorage.getItem('mb_dados') || '') : '' }, e.origin);
      }
    } catch (x) { if (d.mbAuth === 'get') e.source.postMessage({ mbAuth: 'val', token: null }, e.origin); }
  });
  document.getElementById('app').addEventListener('load',function(){ document.getElementById('ld').classList.add('off'); });
  setTimeout(function(){ document.getElementById('ld').classList.add('off'); }, 12000);
</script>
</body>
</html>
