<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estoque MB</title>
<meta name="apple-mobile-web-app-title" content="Estoque MB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07080a">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#07080a;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#07080a}
  #ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#cfd4da;font:600 14px -apple-system,Segoe UI,Arial,sans-serif;transition:opacity .3s}
  #ld img{width:84px;height:84px;border-radius:20px}
  #ld.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="ld"><img src="apple-touch-icon.png" alt=""><span>Carregando o estoque…</span></div>
<iframe id="app" title="Portal do Vendedor" allow="clipboard-read; clipboard-write; web-share; fullscreen"
  src="https://script.google.com/macros/s/AKfycbxBzzrjY3ur7RDzm6goDDU8HZxKbexzJwA_xqTU9Gf2bV-dq_3lOD_TbjZ4qhNu7rvCbg/exec"></iframe>
<script>
  document.getElementById('app').addEventListener('load',function(){ document.getElementById('ld').classList.add('off'); });
  setTimeout(function(){ document.getElementById('ld').classList.add('off'); }, 12000);
</script>
</body>
</html>
